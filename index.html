<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKTEL Alumni CS2 Cup</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF4655;
            --primary-dark: #D63447;
            --gold: #FFB800;
            --bg-dark: #0B0E13;
            --card-bg: rgba(17, 24, 39, 0.8);
            --card-border: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(15, 23, 42, 0.6);
            --accent-glow: rgba(255, 70, 85, 0.15);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(135deg, #0B0E13 0%, #1a1f2e 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F1F5F9;
            overflow-x: hidden;
        }

        .cs2-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                    linear-gradient(rgba(255, 70, 85, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 70, 85, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: var(--primary);
        }

        .orb-2 {
            bottom: -150px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: #3B82F6;
        }

        .font-gaming {
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.05em;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .captain-card {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.08) 0%, rgba(17, 24, 39, 0.85) 100%);
            border: 1px solid rgba(255, 184, 0, 0.25);
            box-shadow: 0 0 40px rgba(255, 184, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .captain-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.5), transparent, rgba(255, 184, 0, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .input-field {
            background: var(--input-bg);
            border: 1.5px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 14px 16px 14px 44px;
            color: #F1F5F9;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
            width: 100%;
        }

        .input-field::placeholder { color: #64748B; }

        .input-field:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .captain-card .input-field:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 184, 0, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748B;
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.05);
        }

        .captain-card .input-wrapper:focus-within .input-icon {
            color: var(--gold);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .badge-captain {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.15), rgba(255, 184, 0, 0.05));
            color: #FFB800;
            border: 1px solid rgba(255, 184, 0, 0.3);
        }

        .badge-player {
            background: rgba(59, 130, 246, 0.1);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .badge-reserve {
            background: rgba(148, 163, 184, 0.08);
            color: #94A3B8;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            box-shadow: 0 10px 40px rgba(255, 70, 85, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 18px;
            padding: 18px 32px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60A5FA;
            border-radius: 16px;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner { animation: spin 1s linear infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: #94A3B8;
        }

        .captain-card .input-label { color: #FCD34D; }
        .header-glow { text-shadow: 0 0 40px rgba(255, 70, 85, 0.4); }

        .nav-button {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .nav-button.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .nav-button:not(.active) {
            background: rgba(148, 163, 184, 0.08);
            color: #94A3B8;
        }

        .nav-button:not(.active):hover {
            background: rgba(148, 163, 184, 0.12);
            color: #CBD5E1;
        }

        .team-list-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .team-list-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }
    </style>
</head>
<body class="min-h-screen pb-36">
<div class="cs2-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div id="app" class="relative z-10 max-w-xl mx-auto px-5 pt-8">

    <!-- Header -->
    <header class="text-center mb-8 animate-in" style="animation-delay: 0s;">
        <div class="inline-flex items-center justify-center mb-4 px-5 py-2.5 rounded-full bg-gradient-to-r from-red-500/10 to-orange-500/10 border border-red-500/20">
            <svg class="w-5 h-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            <span class="text-xs font-bold uppercase tracking-wider text-red-400">AKTEL Alumni</span>
        </div>

        <h1 class="text-5xl sm:text-6xl font-gaming font-bold mb-3 header-glow">CS2 CUP</h1>
        <p class="text-slate-400 text-sm font-medium">Турнир выпускников</p>
    </header>

    <!-- Navigation -->
    <div class="flex gap-3 mb-6 card p-2">
        <button class="nav-button flex-1 active" data-view="register" onclick="switchView('register')">
            Регистрация
        </button>
        <button class="nav-button flex-1" data-view="teams" onclick="switchView('teams')">
            Команды
        </button>
    </div>

    <!-- Registration View -->
    <div id="registerView">
        <div id="existingTeamNotice" class="hidden card p-5 mb-6 border-yellow-500/30">
            <div class="flex items-start gap-3">
                <svg class="w-5 h-5 text-yellow-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <div class="flex-1">
                    <h3 class="font-bold text-yellow-400 mb-1">У вас уже есть команда</h3>
                    <p class="text-sm text-slate-400 mb-3">Вы можете отредактировать существующую команду</p>
                    <button onclick="loadExistingTeam()" class="btn-secondary text-sm">
                        Редактировать команду
                    </button>
                </div>
            </div>
        </div>

        <form id="regForm" onsubmit="submitForm(event)" class="space-y-6">
            <div class="card p-6 animate-in" style="animation-delay: 0.1s;">
                <label class="input-label text-blue-400">Название команды</label>
                <div class="input-wrapper relative">
                    <svg class="input-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <input type="text" id="teamName" required placeholder="NAVI Junior" class="input-field">
                </div>
            </div>

            <div id="playersContainer" class="space-y-5"></div>

            <div class="fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#0B0E13] via-[#0B0E13]/95 to-transparent backdrop-blur-xl z-50 border-t border-white/5">
                <div class="max-w-xl mx-auto">
                    <button type="submit" id="submitBtn" class="btn-primary w-full font-gaming uppercase tracking-wider flex items-center justify-center gap-3">
                        <span id="submitBtnText">Зарегистрировать команду</span>
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Teams List View -->
    <div id="teamsView" class="hidden space-y-4">
        <div id="teamsList"></div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loader" class="fixed inset-0 flex flex-col items-center justify-center bg-[#0B0E13]/98 backdrop-blur-md hidden z-[60]">
    <div class="relative mb-5">
        <div class="absolute inset-0 bg-red-500 blur-2xl opacity-20 rounded-full animate-pulse"></div>
        <div class="w-16 h-16 border-4 border-red-500/20 border-t-red-500 rounded-full spinner"></div>
    </div>
    <p class="text-white font-gaming text-lg uppercase tracking-widest animate-pulse" id="loaderText">Загрузка...</p>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0B0E13');
        tg.setBackgroundColor('#0B0E13');
    }

    const REQUIRED_PLAYERS = 5;
    const MAX_PLAYERS = 6;
    let isEditMode = false;
    let editTeamId = null;

    const playerLabels = ['Капитан команды', 'Игрок 2', 'Игрок 3', 'Игрок 4', 'Игрок 5', 'Запасной игрок'];

    function getInitData() {
        return tg?.initData || '';
    }

    function switchView(view) {
        document.querySelectorAll('.nav-button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === view);
        });

        if (view === 'register') {
            document.getElementById('registerView').classList.remove('hidden');
            document.getElementById('teamsView').classList.add('hidden');
        } else {
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('teamsView').classList.remove('hidden');
            loadAllTeams();
        }
    }

    function renderFields() {
        const container = document.getElementById('playersContainer');
        let html = '';

        for (let i = 1; i <= MAX_PLAYERS; i++) {
            const isCaptain = i === 1;
            const isReserve = i > REQUIRED_PLAYERS;
            const delay = 0.15 + (i * 0.05);

            const cardClass = isCaptain ? 'captain-card' : 'card';
            const badgeClass = isCaptain ? 'badge-captain' : (isReserve ? 'badge-reserve' : 'badge-player');
            const badgeText = playerLabels[i - 1];
            const requiredAttr = isReserve ? '' : 'required';

            const badgeIcon = isCaptain
                ? `<svg class="w-3.5 h-3.5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`
                : `<span class="text-xs mr-1.5">#${i}</span>`;

            html += `
            <div class="${cardClass} p-6 animate-in" style="animation-delay: ${delay}s;">
                <div class="flex items-center justify-between mb-5">
                    <div class="badge ${badgeClass}">
                        ${badgeIcon}
                        <span>${badgeText}</span>
                    </div>
                    ${isReserve ? '<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Опционально</span>' : ''}
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="input-label">Фамилия</label>
                            <div class="input-wrapper relative">
                                <svg class="input-icon w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                <input type="text" name="p${i}_fname" placeholder="Иванов" ${requiredAttr} class="input-field">
                            </div>
                        </div>

                        <div>
                            <label class="input-label">Имя</label>
                            <div class="input-wrapper relative">
                                <svg class="input-icon w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>
                                </svg>
                                <input type="text" name="p${i}_lname" placeholder="Иван" ${requiredAttr} class="input-field">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-${isCaptain ? '2' : '1'} gap-3">
                        <div>
                            <label class="input-label">Год выпуска</label>
                            <div class="input-wrapper relative">
                                <svg class="input-icon w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                <input type="number" name="p${i}_year" placeholder="2024" min="2000" max="2030" ${requiredAttr} class="input-field">
                            </div>
                        </div>

                        ${isCaptain ? `
                        <div>
                            <label class="input-label">Телефон</label>
                            <div class="input-wrapper relative">
                                <svg class="input-icon w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                                <input type="tel" name="p${i}_phone" placeholder="+7 777 123 4567" required class="input-field">
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>

                <input type="hidden" name="p${i}_isCaptain" value="${isCaptain}">
                <input type="hidden" name="p${i}_isReserve" value="${isReserve}">
            </div>
            `;
        }
        container.innerHTML = html;
    }

    async function checkExistingTeam() {
        try {
            const response = await fetch('/api/my-team', {
                headers: {
                    'X-Telegram-Init-Data': getInitData()
                }
            });
            const result = await response.json();

            if (result.success && result.data) {
                document.getElementById('existingTeamNotice').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error checking existing team:', error);
        }
    }

    async function loadExistingTeam() {
        showLoader('Загрузка данных...');
        try {
            const response = await fetch('/api/my-team', {
                headers: {
                    'X-Telegram-Init-Data': getInitData()
                }
            });
            const result = await response.json();

            if (result.success && result.data) {
                const team = result.data;
                isEditMode = true;
                editTeamId = team.id;

                document.getElementById('teamName').value = team.name;
                document.getElementById('submitBtnText').textContent = 'Сохранить изменения';

                team.players.forEach((player, idx) => {
                    const i = idx + 1;
                    document.querySelector(`[name="p${i}_fname"]`).value = player.firstName;
                    document.querySelector(`[name="p${i}_lname"]`).value = player.lastName;
                    document.querySelector(`[name="p${i}_year"]`).value = player.gradYear;
                    if (player.phone) {
                        document.querySelector(`[name="p${i}_phone"]`).value = player.phone;
                    }
                });

                document.getElementById('existingTeamNotice').classList.add('hidden');
            }
        } catch (error) {
            showAlert('Ошибка загрузки команды');
        } finally {
            hideLoader();
        }
    }

    function displayTeams(teams) {
        const container = document.getElementById('teamsList');

        if (!teams || teams.length === 0) {
            container.innerHTML = `
                <div class="card p-8 text-center">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <h3 class="text-lg font-bold text-slate-400 mb-2">Пока нет команд</h3>
                    <p class="text-sm text-slate-500">Станьте первыми, кто зарегистрируется!</p>
                </div>
            `;
            return;
        }

        const totalPlayers = teams.reduce((sum, t) => sum + t.players.length, 0);

        let html = `
            <div class="card p-5 mb-5">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-gaming font-bold text-white">Всего команд: ${teams.length}</h2>
                    <span class="text-sm text-slate-400">Игроков: ${totalPlayers}</span>
                </div>
            </div>
        `;

        teams.forEach((team, idx) => {
            const mainPlayers = team.players.filter(p => !p.isReserve);
            const reservePlayers = team.players.filter(p => p.isReserve);

            html += `
                <div class="team-list-card animate-in" style="animation-delay: ${idx * 0.05}s;">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <h3 class="text-xl font-gaming font-bold text-white">${escapeHtml(team.name)}</h3>
                                <span class="badge badge-player text-[10px] px-2 py-1">#${idx + 1}</span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-slate-500">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                <span>@${escapeHtml(team.telegramUser || 'Unknown')}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-gaming font-bold text-blue-400">${mainPlayers.length}</div>
                            <div class="text-xs text-slate-500 uppercase">Игроков</div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        ${mainPlayers.map(player => `
                            <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-800/30">
                                ${player.isCaptain ? `
                                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-yellow-500/20 to-yellow-600/20 border border-yellow-500/30 flex items-center justify-center flex-shrink-0">
                                        <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                        </svg>
                                    </div>
                                ` : `
                                    <div class="w-8 h-8 rounded-lg bg-slate-700/50 flex items-center justify-center flex-shrink-0">
                                        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                        </svg>
                                    </div>
                                `}
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold text-white truncate">${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</span>
                                        ${player.isCaptain ? '<span class="text-[10px] font-bold text-yellow-400 uppercase">Капитан</span>' : ''}
                                    </div>
                                    <div class="text-xs text-slate-500">Выпуск ${escapeHtml(player.gradYear)}</div>
                                </div>
                            </div>
                        `).join('')}

                        ${reservePlayers.length > 0 ? `
                            <div class="mt-3 pt-3 border-t border-slate-700/50">
                                <div class="text-xs font-bold text-slate-500 uppercase mb-2 flex items-center gap-2">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                    </svg>
                                    Запасные игроки
                                </div>
                                ${reservePlayers.map(player => `
                                    <div class="flex items-center gap-3 p-2.5 rounded-lg bg-slate-800/20 mb-2">
                                        <div class="w-7 h-7 rounded-lg bg-slate-700/30 flex items-center justify-center flex-shrink-0">
                                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                            </svg>
                                        </div>
                                        <div class="flex-1">
                                            <span class="text-sm font-medium text-slate-300">${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</span>
                                            <span class="text-xs text-slate-500 ml-2">Выпуск ${escapeHtml(player.gradYear)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    async function submitForm(e) {
        e.preventDefault();
        triggerHaptic('medium');

        const form = document.getElementById('regForm');
        const formData = new FormData(form);

        const payload = {
            teamName: document.getElementById('teamName').value.trim(),
            players: []
        };

        for (let i = 1; i <= MAX_PLAYERS; i++) {
            const fname = formData.get(`p${i}_fname`)?.trim();
            const lname = formData.get(`p${i}_lname`)?.trim();
            const year = formData.get(`p${i}_year`)?.trim();

            if (i > REQUIRED_PLAYERS && (!fname || !lname)) {
                continue;
            }

            payload.players.push({
                firstName: fname,
                lastName: lname,
                gradYear: year,
                isCaptain: formData.get(`p${i}_isCaptain`) === 'true',
                phone: formData.get(`p${i}_phone`)?.trim() || '',
                isReserve: formData.get(`p${i}_isReserve`) === 'true'
            });
        }

        if (payload.players.length < REQUIRED_PLAYERS) {
            showAlert('Необходимо зарегистрировать минимум 5 основных игроков');
            triggerHaptic('error');
            return;
        }

        showLoader(isEditMode ? 'Обновление...' : 'Регистрация...');

        try {
            const url = isEditMode ? `/api/update?id=${editTeamId}` : '/api/register';
            const method = isEditMode ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': getInitData()
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                triggerHaptic('success');

                showAlert(result.message, () => {
                    if (!isEditMode && tg?.close) {
                        tg.close();
                    } else {
                        form.reset();
                        isEditMode = false;
                        editTeamId = null;
                        document.getElementById('submitBtnText').textContent = 'Зарегистрировать команду';
                        switchView('teams');
                    }
                });
            } else {
                triggerHaptic('error');
                showAlert('Ошибка: ' + result.message);
            }
        } catch (error) {
            console.error('Submit error:', error);
            triggerHaptic('error');
            showAlert('Ошибка соединения с сервером. Попробуйте позже.');
        } finally {
            hideLoader();
        }
    }

    async function loadAllTeams() {
        showLoader('Загрузка команд...');
        try {
            const response = await fetch('/api/teams');
            const result = await response.json();

            if (result.success && result.data) {
                displayTeams(result.data);
            }
        } catch (error) {
            showAlert('Ошибка загрузки команд');
        } finally {
            hideLoader();
        }
    }

    function showLoader(text = 'Загрузка...') {
        document.getElementById('loaderText').textContent = text;
        document.getElementById('loader').classList.remove('hidden');
    }

    function hideLoader() {
        document.getElementById('loader').classList.add('hidden');
    }

    function showAlert(message, callback) {
        if (tg?.showAlert) {
            tg.showAlert(message, callback);
        } else {
            alert(message);
            if (callback) callback();
        }
    }

    function triggerHaptic(type) {
        if (!tg?.HapticFeedback) return;

        if (type === 'success') {
            tg.HapticFeedback.notificationOccurred('success');
        } else if (type === 'error') {
            tg.HapticFeedback.notificationOccurred('error');
        } else {
            tg.HapticFeedback.impactOccurred(type);
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderFields();
        checkExistingTeam();
    });
</script>
</body>
